name: Android playtest build

# Builds an installable debug APK on every push and attaches it to a
# pre-release named after the version in project.godot (v0.3.0-playtest).
on:
  push:
    branches: [main, ccr-0b872a40-0ahxen]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: echo "version=$(grep -oP 'config/version="\K[^"]+' project.godot)" >> "$GITHUB_OUTPUT"

      - name: Export templates, editor settings, preset
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          [ -d ~/.config/godot ] || cp -r /root/.config/godot ~/.config/godot
          [ -d ~/.local/share/godot/export_templates/4.4.1.stable ] || ln -s /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable
          sed -e "s/^version\/name=.*/version\/name=\"${{ steps.v.outputs.version }}\"/" -e "s/^version\/code=.*/version\/code=${{ github.run_number }}/" tools/ci/export_presets.cfg > export_presets.cfg

      - name: Import assets
        run: timeout 900 godot --headless --import || true

      - name: Export the APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" "build/lookout-v${{ steps.v.outputs.version }}.apk"
          ls -la build
          test -s "build/lookout-v${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lookout-v${{ steps.v.outputs.version }}-apk
          path: build/*.apk

      - name: Publish the playtest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-playtest
          name: Lookout v${{ steps.v.outputs.version }} (playtest)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: build/*.apk
          body: |
            Playtest build ${{ github.run_number }} of Lookout v${{ steps.v.outputs.version }}.
            Download the APK on an Android phone or tablet, tap it and allow "install unknown apps".
            What changed: see CHANGELOG.md. How to test and what to report: docs/PLAYTEST.md.
